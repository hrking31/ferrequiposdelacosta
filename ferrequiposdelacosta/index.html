<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      Los iconos del sitio viven en public/ y se sirven desde la raiz. Antes
      esta linea apuntaba a src/assets, una ruta de desarrollo, y los cuatro
      iconos de public/ quedaban sin conectar: el .ico y el de Apple los pedia
      el navegador por convencion, y el de 48 no lo usaba nadie.
      El manifest de la PWA (con los de 192 y 512) lo inyecta solo
      vite-plugin-pwa; ver la seccion "manifest" de vite.config.js.
    -->
    <link rel="icon" type="image/png" href="/favicon-48x48.png" sizes="48x48" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      UN SOLO HTML PARA LAS DOS APPS (2026-11-07): el titulo y el programa que
      arranca los pone vite.config.js segun la app que se arme. Lo que va entre
      "solo:tienda" o "solo:personal" queda solo en esa app.
    -->
    <title>__TITULO__</title>
    <!-- solo:personal -->
    <!-- La app del personal no tiene nada que mostrar en un buscador. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- /solo:personal -->
    <!-- solo:tienda -->
    <meta name="description" content="Alquiler de equipos para la construcción en la costa caribe. Mira el catálogo y pide tu cotización." />
    <!--
      LA TARJETA AL COMPARTIR EL ENLACE (pedido del dueño, 2026-11-06): lo que
      muestran WhatsApp, Facebook y compañía al pegar la dirección. La imagen
      va con la dirección completa —así la piden— y en PNG de 1200 × 630:
      WhatsApp no muestra SVG. WhatsApp guarda la tarjeta un tiempo, así que un
      cambio acá tarda en verse en los enlaces ya compartidos.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="Ferrequipos de la Costa" />
    <meta property="og:title" content="Ferrequipos de la Costa" />
    <meta property="og:description" content="Alquiler de equipos para la construcción en la costa caribe. Mira el catálogo y pide tu cotización." />
    <meta property="og:url" content="https://www.ferrequiposdelacosta.com/" />
    <meta property="og:image" content="https://www.ferrequiposdelacosta.com/og-ferrequipos.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Ferrequipos" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- /solo:tienda -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="__ENTRADA__"></script>
  </body>
</html>
